active_provider: ollama
narrative:
  mode: llm
  max_tokens_per_section: 2500
  # The CAM system prompt and per-section prompts live in code:
  # SYSTEM_PROMPT / CAM_SECTIONS in src/engines/cam_llm_renderer.py (bump PROMPT_VERSION on change).
  max_tokens: 16000
  temperature: 0.15
providers:
  mock:
    name: Mock (Deterministic)
    type: mock
    description: Template-based rendering — no API calls, fully deterministic
  openai:
    name: OpenAI GPT-4
    type: openai
    model: gpt-4
    api_key_env: OPENAI_API_KEY
    temperature: 0.1
    max_tokens: 8000
  anthropic:
    name: Anthropic Claude
    type: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    temperature: 0.1
    max_tokens: 8000
  azure_openai:
    name: Azure OpenAI
    type: azure_openai
    deployment: gpt-4
    api_key_env: AZURE_OPENAI_API_KEY
    endpoint_env: AZURE_OPENAI_ENDPOINT
    api_version: 2024-02-15-preview
    temperature: 0.1
    max_tokens: 8000
  vertex_ai_gemini:
    name: Gemini (Vertex AI)
    type: vertex_ai_gemini
    model: gemini-2.0-flash
    project: kmark-489115
    location: us-central1
    api_key_env: GOOGLE_API_KEY
    temperature: 0.15
    max_tokens: 4000
  ollama:
    name: Ollama (Local)
    type: ollama
    # Install first:  ollama pull qwen3:8b   (~5.2 GB; runs on CPU with 16 GB RAM)
    model: qwen3:8b
    base_url: http://localhost:11434    # OLLAMA_HOST env var overrides this
    temperature: 0.15
    max_tokens: 4000
    num_ctx: 8192                       # starting context window (tokens)
    max_num_ctx: 32768                  # grown per prompt up to this, so long sections are never truncated
    # qwen3 "thinks" before answering by default; off = much faster on CPU and
    # the whole token budget goes to the CAM text. Leave unset for non-thinking models.
    think: false
    timeout_seconds: 1800               # per CAM section (CPU inference is slow)
    chat_timeout_seconds: 600           # per Financial Advisor chat reply
