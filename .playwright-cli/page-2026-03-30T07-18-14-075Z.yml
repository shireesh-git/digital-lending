            - paragraph [ref=e466]: 404 - when a resource is not found.
            - paragraph [ref=e467]: 429 - Credits are not sufficient to make this call, please purchase credits.
            - paragraph [ref=e468]: 500 - Any server side error.
            - paragraph [ref=e469]: 502 - timeout errors - if we have some issue in our backend systems.
