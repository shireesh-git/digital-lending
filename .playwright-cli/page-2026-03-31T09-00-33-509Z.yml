                  - heading "Pricing & End Use" [level=4] [ref=e514]
                  - text: The interest rate is set at 9.20% p.a., which includes the base rate (MCLR + 0.80%). Additional fees include processing charges of 0.25%, commitment charges of 0.50% on undrawn amounts, and a penal interest rate of 2% above the applicable rate.
