                  - text: Infosys Limited operates within India's IT-BPM sector, which is robust and growing. The industry revenue stood at approximately $245 billion in FY2024, contributing 8% to the GDP. Digital services now account for about 35% of total revenue, driven by global digital transformation trends. Infosys holds a strong market position with an investment-grade rating from CRISIL (AAA), reflecting its financial health and stability.
