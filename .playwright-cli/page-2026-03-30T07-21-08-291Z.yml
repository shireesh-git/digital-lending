          - heading "FAQs" [level=1] [ref=e826]
          - list [ref=e830]:
            - listitem [ref=e831]:
              - generic [ref=e832]:
                - paragraph [ref=e833]: 1. What are the technology foundations on which the Probe42 API is built?
                - generic: 
              - paragraph [ref=e834]:
                - text: Probe API is published, maintained and secured via Amazon API Gateway. The Gateway receives, handles, queues and processes the API requests. It also provides capabilities for traffic management, authorization, and versioning management. The API endpoints provided are RESTful and are accessed via HTTPS.
                - text: Each user-application will have to obtain a unique private authentication key, which must be provided in the request header of every API call. The Probe API response is in JSON format. Probe’s backend servers and databases are all on the Amazon Web Services (AWS) cloud; API calls are routed to back-end business logic by the API Gateway.
            - listitem [ref=e835]:
              - generic [ref=e836]:
                - paragraph [ref=e837]: 2. How does Probe42 API handle security and authentication?
                - generic: 
              - paragraph [ref=e838]:
                - text: "API Keys: Each customer user application will need to generate and privately store an authentication key. This is the secret key that authenticates each application. The key needs to be passed along in the request header. For every call, the API gateway checks the key against the user database for authenticity; if this check fails, the request is not allowed to go through."
                - text: "HTTPS: Calls to Probe API endpoints need to be made over the HTTPS protocol. Communications between the user application and Probe’s servers will happen on an SSL-encrypted channel."
                - text: "TLS encryption: Enforced TLS encryption for data transmitted over networks."
            - listitem [ref=e839]:
              - generic [ref=e840]:
                - paragraph [ref=e841]: 3. How does Probe42 API guarantee uptime?
                - generic: 
              - paragraph [ref=e842]: Probe provides server replication and failover capabilities to ensure uptime.
            - listitem [ref=e843]:
              - generic [ref=e844]:
                - paragraph [ref=e845]: 4. What are the different possible error types that need to be handled?
                - generic: 
              - paragraph [ref=e846]: "There are broadly two types of errors: client-side errors (call made with incorrect parameters, API key missing in the request header, etc.) are 400-series, and server-side errors (problem with backend systems, etc.) are 500-series. A list of the error codes is provided in our API documentation."
            - listitem [ref=e847]:
              - generic [ref=e848]:
                - paragraph [ref=e849]: 5. Will any new releases to API in the future impact existing client integrations?
                - generic: 
              - paragraph [ref=e850]: Probe42 API is backward compatible. No new release will impact existing integrations.
            - listitem [ref=e851]:
              - generic [ref=e852]:
                - paragraph [ref=e853]: 6. What are the usage limits?
                - generic: 
              - paragraph [ref=e854]: If you are sending too many requests too quickly, you will receive a 4XX HTTP response. We have a rate-limiting set on our servers.
